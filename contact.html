<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Digital Alchemist</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-container {
            padding: 8rem 10% 4rem;
            display: flex;
            gap: 4rem;
            flex-wrap: wrap;
        }

        .contact-info {
            flex: 1;
            min-width: 300px;
        }

        .contact-form {
            flex: 1.5;
            min-width: 300px;
            background: #0f0f13;
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            background: var(--bg-color);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-color);
            font-family: var(--font-main);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .contact-method {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .contact-method i {
            width: 50px;
            height: 50px;
            background: var(--glass-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .social-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">Digital Alchemist<span class="accent">.</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="location.html">Location</a></li>
            <li><a href="testimonials.html">Testimonials</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div class="hamburger"><i class="fas fa-bars"></i></div>
    </nav>

    <main>
        <section class="contact-container">
            <div class="contact-info">
                <h1>Let's Create <br><span class="gradient-text">Something Big</span></h1>
                <p style="color: var(--text-muted); margin: 1.5rem 0 3rem;">Ready to elevate your brand? Drop me a
                    message and let's discuss how we can drive results for your business.</p>

                <div class="contact-method">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h4>Email Me</h4>
                        <a href="mailto:hello@example.com" style="color: var(--text-muted);">hello@example.com</a>
                    </div>
                </div>
                <div class="contact-method">
                    <i class="fas fa-phone"></i>
                    <div>
                        <h4>Call Me</h4>
                        <p style="color: var(--text-muted);">+1 (555) 123-4567</p>
                    </div>
                </div>

                <div class="social-links">
                    <a href="#" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#" class="social-btn"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-btn"><i class="fab fa-instagram"></i></a>
                </div>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-control" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" class="form-control" placeholder="Project Inquiry">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea class="form-control" rows="5" placeholder="Tell me about your project..."></textarea>
                </div>
                <button type="submit" class="btn primary">Send Message <i class="fas fa-paper-plane"></i></button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
